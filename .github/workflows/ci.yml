
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  LANGS: python javascript

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -t .
        working-directory: backend

      - name: Python judge self-test
        run: python -m judge.selftest
        working-directory: backend

      - name: JavaScript judge self-test
        run: python -m judge.selftest
        working-directory: backend
        env:
          LANGUAGE: javascript

      - name: Install CDK dependencies and synthesize
        run: npm install && npx cdk synth --quiet
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1

  build:
    name: Build and Security Scan
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lang: [python, javascript]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build judge image
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            LANGUAGE=${{ matrix.lang }}
            IMAGE_TAG=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: judge-${{ matrix.lang }}:ci
          cache-from: type=gha,scope=${{ matrix.lang }}
          cache-to: type=gha,mode=max,scope=${{ matrix.lang }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: judge-${{ matrix.lang }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Self-test image with restricted container settings
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /sandbox:rw,exec,mode=755 \
            --tmpfs /tmp \
            --network none \
            --cap-drop ALL \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add KILL \
            --cap-add CHOWN \
            judge-${{ matrix.lang }}:ci \
            python3 -m judge.selftest

      - name: Save image
        run: docker save judge-${{ matrix.lang }}:ci | gzip > image-${{ matrix.lang }}.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.lang }}
          path: image-${{ matrix.lang }}.tgz
          retention-days: 1

  cd-readiness:
    name: CD Package Verification (No AWS Deployment)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download judge image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images

      - name: Verify Python and JavaScript packages
        run: |
          set -euo pipefail

          test -s images/image-python/image-python.tgz
          test -s images/image-javascript/image-javascript.tgz

          echo "Python judge image artifact verified."
          echo "JavaScript judge image artifact verified."
          echo "CD package verification passed."
          echo "AWS deployment was not executed."


