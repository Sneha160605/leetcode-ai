
name: Socratic LeetCode CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -t .

      - name: Python judge self-test
        working-directory: backend
        run: python -m judge.selftest

      - name: JavaScript judge self-test
        working-directory: backend
        env:
          LANGUAGE: javascript
        run: python -m judge.selftest

      - name: Install CDK dependencies and synthesize
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1
        run: |
          npm install
          npx cdk synth --quiet

  build:
    name: Build and Security Scan
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lang:
          - python
          - javascript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build judge Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            LANGUAGE=${{ matrix.lang }}
            IMAGE_TAG=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: judge-${{ matrix.lang }}:ci

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: judge-${{ matrix.lang }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Save Docker image
        run: |
          docker save judge-${{ matrix.lang }}:ci | gzip > image-${{ matrix.lang }}.tgz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.lang }}
          path: image-${{ matrix.lang }}.tgz
          retention-days: 1

  cd-readiness:
    name: CD Package Verification
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images

      - name: Verify deployment packages
        run: |
          set -euo pipefail

          test -s images/image-python/image-python.tgz
          test -s images/image-javascript/image-javascript.tgz

          echo "Python Docker image verified."
          echo "JavaScript Docker image verified."
          echo "CD package verification successful."

  aws-deployment:
    name: AWS Deployment
    needs: cd-readiness
    runs-on: ubuntu-latest

    steps:
      - name: Deployment pipeline execution
        run: |
          echo "Starting Socratic LeetCode deployment pipeline..."
          echo "CI tests completed successfully."
          echo "Docker images built and scanned."
          echo "Deployment packages verified."
          echo "Deployment pipeline simulation completed."
          echo "No actual AWS resources were deployed."


